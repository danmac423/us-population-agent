- id: H2
  category: meta
  history:
    - role: user
      content: What is the poverty rate in Mississippi?
    - role: assistant
      content: >-
        The poverty rate in Mississippi is 19.58%: 564,439 of 2,883,074 people
        for whom poverty status is determined (ACS 2020 5-year estimates).
  question: How did you calculate that poverty rate?
  reference: >-
    Explains the method: people with income below 1.00 x the poverty threshold
    (the official poverty definition) divided by people for whom poverty status
    is determined, based on ACS 2020 5-year estimates.
    Repeating figures from the previous answer (564,439; 2,883,074; 19.58%) is allowed.
    Table or column identifiers are not required.
    Must not run new queries or introduce figures that are not in the history.

